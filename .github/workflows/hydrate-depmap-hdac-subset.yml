name: Hydrate DepMap 26Q1 HDAC subset

on:
  push:
    branches:
      - major-revision-2026
    paths:
      - revision/requests/depmap_26q1_hdac_subset.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: depmap-hdac-subset-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hydrate-subset:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out the request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned data dependency
        run: python -m pip install pandas==2.3.3

      - name: Hydrate exact-release HDAC source subset
        run: python scripts/hydrate_depmap_hdac_subset.py

      - name: Commit the validated small subset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/revision/depmap_hdac_background/source_subset
          if git diff --cached --quiet; then
            echo "The validated DepMap HDAC subset is already current."
            exit 0
          fi
          git commit -m "data: hydrate DepMap 26Q1 HDAC subset"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
